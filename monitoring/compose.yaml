name: travel-watch
services:
  watch:
    image: travel-watch:2
    build: .
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:3001:3001"
    networks: [travel]
    volumes:
      - data:/data
      - /etc/travel-watch/config.json:/run/watch/config.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:3001/health', timeout=3).read()"]
      interval: 20s
      timeout: 4s
      retries: 3
networks:
  travel:
    external: true
    name: travel-web_default
volumes:
  data:

