name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: 单元/组件测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  go-chat:
    name: Go 聊天服务测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-chat-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-chat-server/go.mod
          cache-dependency-path: go-chat-server/go.sum
      - run: go vet ./...
      - run: go test ./...
